<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.85">
    <title>StudentHub-AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-graduation-cap"></i>
            <span>StudentHub-AI</span>
        </div>
        <div class="sidebar-tabs">
            <button class="sidebar-tab active" id="masterNoteTab" data-tab="master-note">Master-Note</button>
            <button class="sidebar-tab" id="pastQuestionsTab" data-tab="past-questions">Past-Questions</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <input type="text" class="search-bar" placeholder="🔍 Search for courses, notes, or past questions...">
            <button class="sign-in-btn" id="signInBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span id="authBtnText">Sign In</span>
            </button>
        </div>

        <div class="master-note-view" id="masterNoteView">
            <h1 class="page-heading">Topics</h1>
        </div>

        <div class="past-questions-view" id="pastQuestionsView" style="display: none;">
        </div>

    </div>

    <!-- Topics Modal -->
    <div id="topicsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; overflow-y: auto; padding: 20px;">
        <div style="background: white; border-radius: 16px; max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
            <button id="closeTopicsModalBtn" style="position: sticky; top: 0; float: right; background: none; border: none; font-size: 28px; cursor: pointer; color: #777; z-index: 10;">×</button>
            <h2 id="modalTitle" style="color: var(--dark); margin-bottom: 20px; font-size: 24px;">Course Topics</h2>
            <div id="modalContent">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
